name: Drill Cloud smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: UI URL
        required: true
        default: https://alpha.drillcloud.ru
      api_url:
        description: Cloud API URL including /api
        required: true
        default: https://alpha.drillcloud.ru/api
      priority:
        description: Test priority
        required: true
        default: p0
        type: choice
        options: [p0, p1, all]
      browser:
        description: Browser
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_API_URL: ${{ inputs.api_url }}
      E2E_BROWSER: ${{ inputs.browser }}
      E2E_AUTH_MODE: required
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EDGE_ID: ${{ vars.E2E_EDGE_ID }}
      E2E_VIDEO_EDGE_ID: ${{ vars.E2E_VIDEO_EDGE_ID }}
      E2E_NO_VIDEO_EDGE_ID: ${{ vars.E2E_NO_VIDEO_EDGE_ID }}
      E2E_INDICATOR_QUERY: ${{ vars.E2E_INDICATOR_QUERY }}
      E2E_HISTORY_TAG_QUERY: ${{ vars.E2E_HISTORY_TAG_QUERY }}
      E2E_LIVE_TAG: ${{ vars.E2E_LIVE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps "${{ inputs.browser }}"

      - name: Check test code
        run: |
          python -m ruff check .
          python -m mypy src

      - name: Run smoke suite
        shell: bash
        run: |
          marker=()
          if [[ "${{ inputs.priority }}" != "all" ]]; then
            marker=(-m "${{ inputs.priority }}")
          fi
          python -m pytest "${marker[@]}" -v \
            --html=reports/smoke-report.html \
            --self-contained-html

      - name: Upload smoke report and Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.browser }}-${{ inputs.priority }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

